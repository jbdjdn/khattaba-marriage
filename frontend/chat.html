<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدردشة - خطابة لزواج</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
.chat-list{display:flex;flex-direction:column;gap:8px}
.conversation-item{display:flex;align-items:center;gap:11px;padding:11px 12px;background:rgba(255,255,255,.82);border:1px solid rgba(232,221,208,.75);border-radius:18px;cursor:pointer;transition:.18s ease}
.conversation-item:active{transform:scale(.99);background:var(--surface-2)}
.conversation-photo{width:50px;height:50px;border-radius:50%;object-fit:cover;background:#eee;flex-shrink:0}
.conversation-info{flex:1;min-width:0}
.conversation-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}
.conversation-name{font-weight:700;color:var(--text);font-size:15px}
.conversation-time{font-size:10px;color:var(--muted);white-space:nowrap}
.conversation-preview{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-screen{display:none}
.chat-header-user{display:flex;align-items:center;gap:10px;padding:9px 11px;background:rgba(255,255,255,.72);border:1px solid rgba(232,221,208,.7);border-radius:18px;margin-bottom:7px;min-height:60px}
.chat-header-user img{width:43px;height:43px;border-radius:50%;object-fit:cover}
.messages-box{min-height:400px;max-height:62vh;overflow-y:auto;padding:8px 2px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.message-row{display:flex;width:100%}
.message-row.mine{justify-content:flex-start}
.message-row.theirs{justify-content:flex-end}
.message-bubble{max-width:76%;padding:8px 11px;border-radius:15px;line-height:1.55;word-break:break-word;font-size:14px;box-shadow:0 2px 8px rgba(90,63,43,.04)}
.message-row.mine .message-bubble{background:var(--primary);color:#fff;border-bottom-left-radius:5px}
.message-row.theirs .message-bubble{background:#fff;color:var(--text);border:1px solid rgba(232,221,208,.8);border-bottom-right-radius:5px}
.message-time{display:block;font-size:9px;opacity:.65;margin-top:2px}
.chat-input-area{display:flex;align-items:center;gap:7px;margin-top:6px;position:sticky;bottom:70px;background:linear-gradient(to top,var(--surface) 75%,transparent);padding:7px 1px 8px}
.chat-input-area input{flex:1;min-width:0;height:43px!important;padding:0 15px!important;border:1px solid rgba(180,138,106,.22)!important;border-radius:22px!important;background:rgba(255,255,255,.92)!important;color:var(--text);font-size:14px!important;outline:none;box-shadow:0 4px 14px rgba(90,63,43,.05)}
.chat-input-area input:focus{border-color:rgba(180,138,106,.55)!important;box-shadow:0 0 0 3px rgba(180,138,106,.08)}
#sendBtn{width:43px;height:43px;min-width:43px;padding:0;border:0;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-family:inherit;font-size:0;box-shadow:0 6px 15px rgba(109,77,53,.2);cursor:pointer;position:relative}
#sendBtn::after{content:"➤";font-size:17px;display:flex;align-items:center;justify-content:center;width:100%;height:100%;transform:rotate(180deg)}
#sendBtn:active{transform:scale(.94)}
.new-message-toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#5a3f2b;color:#fff;padding:9px 16px;border-radius:18px;z-index:9999;display:none;box-shadow:0 5px 20px rgba(0,0,0,.16);font-size:13px}
.back-chat-btn{margin-bottom:7px;padding:8px 13px!important;min-height:38px!important;border-radius:14px!important;font-size:13px!important}
.message-date-divider{text-align:center;margin:12px auto;padding:4px 11px;width:max-content;background:var(--surface-2);color:var(--muted);border-radius:11px;font-size:11px}
.conversation-unread{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;margin-right:5px;padding:0 5px;background:#c0392b;color:#fff;border-radius:10px;font-size:9px;font-weight:bold;vertical-align:middle}
@media(max-width:380px){
.chat-header-user{min-height:56px}
.chat-header-user img{width:40px;height:40px}
.messages-box{max-height:60vh}
.chat-input-area input{height:41px!important}
#sendBtn{width:41px;height:41px;min-width:41px}
.message-bubble{font-size:13px;padding:7px 10px}
}
</style>
</head>

<body>

<div class="app">

    <header class="page-header">
        <button class="back-btn" onclick="history.back()">↩</button>
        <h1>💌 الدردشة</h1>
    </header>

    <main class="page-content">

        <div id="notification" class="new-message-toast"></div>

        <!-- قائمة المحادثات -->
        <section id="conversationScreen">
            <div id="conversationList" class="chat-list">
                <div class="empty-state">جاري تحميل المحادثات...</div>
            </div>
        </section>

        <!-- المحادثة -->
        <section id="chatScreen" class="chat-screen">

            <button
                id="backToChats"
                class="secondary-btn back-chat-btn"
                type="button"
            >
                ↩ العودة للمحادثات
            </button>

            <div id="chatUser" class="chat-header-user">
                جاري تحميل المستخدم...
            </div>

            <div id="messages" class="messages-box"></div>

            <div class="chat-input-area">
                <input
                    id="messageInput"
                    type="text"
                    placeholder="اكتب رسالتك..."
                    maxlength="2000"
                >

                <button id="sendBtn" class="primary-btn">
                    إرسال
                </button>
            </div>

        </section>

    </main>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <span>💍</span>
            <small>اكتشف</small>
        </a>

        <a href="search.html" class="nav-item">
            <span>🔎</span>
            <small>بحث</small>
        </a>

        <a href="chat.html" class="nav-item active">
            <span>💬</span>
            <small>دردشة <b id="chatBadge" style="display:none;background:#c0392b;color:white;border-radius:10px;padding:1px 6px;font-size:10px;">0</b></small>
        </a>

        <a href="about-me.html" class="nav-item">
            <span>📝</span>
            <small>تعريفي</small>
        </a>

        <a href="profile.html" class="nav-item">
            <span>👤</span>
            <small>ملفي</small>
        </a>
    </nav>

</div>

<script>

const token = localStorage.getItem("session_token");

if (!token) {
    window.location.href = "index.html";
}

const params = new URLSearchParams(window.location.search);
let activeUserId = params.get("user");

const conversationScreen =
    document.getElementById("conversationScreen");

const chatScreen =
    document.getElementById("chatScreen");

const conversationList =
    document.getElementById("conversationList");

const chatUser =
    document.getElementById("chatUser");
const chatBadge = document.getElementById("chatBadge");
let lastUnreadCount = 0;
let unreadCountInitialized = false;

async function updateChatBadge(showNewNotification = true) {
    try {
        const response = await fetch("/api/chat/unread-count", { headers: authHeaders() });
        const data = await response.json();
        const count = Number(data.count || 0);

        if (
            showNewNotification &&
            unreadCountInitialized &&
            count > lastUnreadCount
        ) {
            showNotification("💌 وصلت رسالة جديدة");
        }

        lastUnreadCount = count;
        unreadCountInitialized = true;

        if (count > 0) {
            chatBadge.textContent = count > 99 ? "99+" : count;
            chatBadge.style.display = "inline-block";
        } else {
            chatBadge.style.display = "none";
        }
    } catch (error) {
        console.error("chat badge error:", error);
    }
}


const messagesBox =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const backToChats =
    document.getElementById("backToChats");

const notification =
    document.getElementById("notification");

let lastMessageId = 0;
let firstLoad = true;

function authHeaders() {
    return {
        "Authorization": `Bearer ${token}`
    };
}

function formatTime(dateString) {
    if (!dateString) return "";

    const date = new Date(
        dateString.replace(" ", "T") + "Z"
    );

    return date.toLocaleTimeString("ar-YE", {
        hour: "2-digit",
        minute: "2-digit"
    });
}

function showNotification(text) {
    notification.textContent = text;
    notification.style.display = "block";

    setTimeout(() => {
        notification.style.display = "none";
    }, 4000);
}

async function loadConversations() {

    try {

        const response = await fetch(
            "/api/chat/list",
            {
                headers: authHeaders()
            }
        );

        const data = await response.json();

        if (!response.ok) {
            conversationList.innerHTML =
                `<div class="empty-state">
                    تعذر تحميل المحادثات
                </div>`;
            return;
        }

        const conversations =
            data.conversations || [];

        if (!conversations.length) {

            conversationList.innerHTML =
                `<div class="empty-state">
                    لا توجد محادثات بعد.<br>
                    ابدأ التواصل من صفحة اكتشف.
                </div>`;

            return;
        }

        conversationList.innerHTML = "";

        conversations.forEach(conversation => {

            const item =
                document.createElement("div");

            item.className =
                "conversation-item";

            const photo =
                conversation.profile_image ||
                "assets/default-avatar.png";

            const name =
                `${conversation.first_name || ""} ${conversation.last_name || ""}`.trim()
                || conversation.username
                || "مستخدم";

            const preview =
                conversation.last_message ||
                "ابدأ المحادثة";

            const time =
                formatTime(
                    conversation.last_message_at
                );

            item.innerHTML = `
                <img
                    class="conversation-photo"
                    src="${photo}"
                    onerror="this.style.display='none'"
                >

                <div class="conversation-info">

                    <div class="conversation-top">
                        <span class="conversation-name">
                            ${name}
                            ${
                                Number(conversation.unread_count || 0) > 0
                                    ? `<b class="conversation-unread">${Number(conversation.unread_count) > 99 ? "99+" : Number(conversation.unread_count)}</b>`
                                    : ""
                            }
                        </span>

                        <span class="conversation-time">
                            ${time}
                        </span>
                    </div>

                    <div class="conversation-preview">
                        ${preview}
                    </div>

                </div>
            `;

            item.addEventListener(
                "click",
                () => openChat(
                    conversation.other_user_id
                )
            );

            conversationList.appendChild(item);
        });

    } catch (error) {

        conversationList.innerHTML =
            `<div class="empty-state">
                تعذر الاتصال بالسيرفر
            </div>`;
    }
}

async function loadUser() {

    if (!activeUserId) return;

    const response = await fetch(
        `/api/profile/${activeUserId}`,
        {
            headers: authHeaders()
        }
    );

    const data = await response.json();

    if (!data.success) {
        chatUser.textContent =
            data.message ||
            "تعذر تحميل الملف";
        return;
    }

    const user = data.profile;

    chatUser.innerHTML = `
        <img
            src="${user.profile_image || ""}"
            onerror="this.style.display='none'"
        >

        <div>
            <strong>
                ${user.first_name || ""} ${user.last_name || ""}
            </strong>

            <div style="color:#8b796a;">
                ${user.age || ""} سنة · ${user.city || ""}
            </div>
        </div>
    `;
}

async function loadMessages(showNewNotification = true) {

    if (!activeUserId) return;

    try {

        const response = await fetch(
            `/api/chat/messages/${activeUserId}`,
            {
                headers: authHeaders()
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            messagesBox.innerHTML =
                `<div class="empty-state">
                    ${data.message || "تعذر تحميل الرسائل"}
                </div>`;
            return;
        }

        const messages =
            data.messages || [];

        if (!messages.length) {

            messagesBox.innerHTML =
                `<div class="empty-state">
                    لا توجد رسائل بعد.<br>
                    ابدأ التواصل برسالة محترمة.
                </div>`;

            return;
        }

        const newest =
            messages[messages.length - 1];

        if (
            showNewNotification &&
            !firstLoad &&
            newest.id > lastMessageId &&
            Number(newest.sender_id) !== Number(currentUserId)
        ) {
            showNotification("💌 وصلت رسالة جديدة");
        }

        lastMessageId = newest.id;

        messagesBox.innerHTML = "";

        let previousDate = "";

        messages.forEach(message => {

            const messageDate = new Date(
                String(message.created_at).replace(" ", "T") + "Z"
            );

            const dateKey =
                messageDate.toLocaleDateString("en-CA");

            if (dateKey !== previousDate) {

                const dateDivider =
                    document.createElement("div");

                dateDivider.className =
                    "message-date-divider";

                const today =
                    new Date().toLocaleDateString("en-CA");

                const yesterday =
                    new Date(
                        Date.now() - 86400000
                    ).toLocaleDateString("en-CA");

                if (dateKey === today) {
                    dateDivider.textContent = "اليوم";
                } else if (dateKey === yesterday) {
                    dateDivider.textContent = "أمس";
                } else {
                    dateDivider.textContent =
                        messageDate.toLocaleDateString(
                            "ar-YE",
                            {
                                weekday: "long",
                                year: "numeric",
                                month: "long",
                                day: "numeric"
                            }
                        );
                }

                messagesBox.appendChild(dateDivider);
                previousDate = dateKey;
            }

            const mine =
                Number(message.sender_id) ===
                Number(currentUserId);

            const row =
                document.createElement("div");

            row.className =
                `message-row ${mine ? "mine" : "theirs"}`;

            const bubble =
                document.createElement("div");

            bubble.className =
                "message-bubble";

            bubble.textContent =
                message.message;

            const time =
                document.createElement("span");

            time.className =
                "message-time";

            time.textContent =
                formatTime(message.created_at);

            bubble.appendChild(time);
            row.appendChild(bubble);
            messagesBox.appendChild(row);
        });

        messagesBox.scrollTop =
            messagesBox.scrollHeight;

        firstLoad = false;

    } catch (error) {
        console.error(error);
    }
}

let currentUserId = null;

async function getCurrentUserId() {

    if (currentUserId) {
        return currentUserId;
    }

    try {

        const response =
            await fetch(
                "/api/me",
                {
                    headers: authHeaders()
                }
            );

        const data =
            await response.json();

        currentUserId =
            data.user?.id ||
            data.id ||
            null;

        return currentUserId;

    } catch (error) {

        return null;
    }
}

async function openChat(userId) {

    activeUserId = String(userId);

    history.pushState(
        {},
        "",
        `chat.html?user=${activeUserId}`
    );

    conversationScreen.style.display =
        "none";

    chatScreen.style.display =
        "block";

    lastMessageId = 0;
    firstLoad = true;

    try {
        await fetch(
            `/api/chat/read/${activeUserId}`,
            {
                method: "POST",
                headers: authHeaders()
            }
        );
    } catch (error) {
        console.error("mark chat read error:", error);
    }

    await loadUser();
    await loadMessages(false);
    await updateChatBadge(false);
}

function closeChat() {

    activeUserId = null;

    history.pushState(
        {},
        "",
        "chat.html"
    );

    chatScreen.style.display =
        "none";

    conversationScreen.style.display =
        "block";

    loadConversations();
}

async function sendMessage() {

    const message =
        messageInput.value.trim();

    if (!message || !activeUserId) {
        return;
    }

    sendBtn.disabled = true;

    try {

        const response =
            await fetch(
                "/api/chat/send",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",
                        "Authorization":
                            `Bearer ${token}`
                    },

                    body: JSON.stringify({
                        otherUserId:
                            activeUserId,
                        message
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok || !data.success) {

            alert(
                data.message ||
                data.error ||
                "تعذر إرسال الرسالة"
            );

            return;
        }

        messageInput.value = "";

        await loadMessages(false);

    } catch (error) {

        alert("تعذر الاتصال بالسيرفر");

    } finally {

        sendBtn.disabled = false;
        messageInput.focus();
    }
}

sendBtn.addEventListener(
    "click",
    sendMessage
);

messageInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            event.preventDefault();
            sendMessage();
        }

    }
);

backToChats.addEventListener(
    "click",
    closeChat
);

async function refreshChat() {

    if (activeUserId) {

        await loadMessages(true);
        await updateChatBadge(false);

    } else {

        await loadConversations();
        await updateChatBadge(true);

    }
}

/*
    تحديث تلقائي مستمر.
    السيرفر هو المسؤول عن حفظ الرسائل،
    والواجهة تستعلم عن الجديد بشكل دوري.
*/
setInterval(
    refreshChat,
    5000
);

(async function start() {

    await getCurrentUserId();

    if (activeUserId) {

        conversationScreen.style.display =
            "none";

        chatScreen.style.display =
            "block";

        await loadUser();
        await loadMessages(false);

    } else {

        await loadConversations();

    }

})();

</script>

<script src="js/notifications.js"></script>
<script src="js/push.js"></script>
</body>
</html>
