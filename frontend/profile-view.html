<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي - خطابة لزواج</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app member-app">

    <header class="member-header">

        <button
            class="icon-button"
            type="button"
            onclick="history.back()"
        >
            ← رجوع
        </button>

        <div>
            <div class="brand">💍 خطابة لزواج</div>
        </div>

    </header>


    <main class="member-content">

        <div id="loadingBox" class="empty-suggestions">

            <div class="empty-icon">⏳</div>

            <h2>جاري تحميل الملف</h2>

            <p>لحظات...</p>

        </div>


        <section id="profileContent" style="display:none;">

            <div class="profile-view-card">

                <div class="profile-view-image-wrap">

                    <img
                        id="profileImage"
                        src=""
                        alt="الصورة الشخصية"
                    >

                </div>


                <div class="profile-view-info">

                    <h1 id="profileName">—</h1>

                    <p id="profileLocation">—</p>

                    <div class="profile-meta">

                        <span id="profileAge">—</span>

                        <span id="profileHeight">—</span>

                        <span id="profileWeight">—</span>

                        <span id="profileReligion">—</span>

                    </div>

                </div>

            </div>


            <section class="detail-section">

                <h2>📋 التفاصيل</h2>

                <div class="detail-list">

                    <div>
                        <strong>الجنسية</strong>
                        <span id="nationality">—</span>
                    </div>

                    <div>
                        <strong>بلد الإقامة</strong>
                        <span id="residenceCountry">—</span>
                    </div>

                    <div>
                        <strong>المدينة</strong>
                        <span id="city">—</span>
                    </div>

                    <div>
                        <strong>الطول</strong>
                        <span id="height">—</span>
                    </div>

                    <div>
                        <strong>الوزن</strong>
                        <span id="weight">—</span>
                    </div>

                    <div>
                        <strong>الدين</strong>
                        <span id="religion">—</span>
                    </div>

                    <div>
                        <strong>لون البشرة</strong>
                        <span id="skinColor">—</span>
                    </div>

                </div>

            </section>


            <section class="bio-section">

                <h2>📝 نبذة عني</h2>

                <p id="aboutMe">—</p>

            </section>


            <section class="bio-section">

                <h2>💍 نبذة عن شريك الحياة</h2>

                <p id="partnerDescription">—</p>

            </section>


            <section class="quick-actions">

                <button
                    class="member-action primary-action"
                    type="button"
                    onclick="contactPerson()"
                >
                    💌 تواصل
                </button>

                <button
                    class="member-action"
                    type="button"
                    onclick="skipPerson()"
                >
                    ❌ تخطي
                </button>

                <button
                    class="member-action"
                    type="button"
                    onclick="history.back()"
                >
                    ↩️ تراجع
                </button>

                <button
                    class="member-action boost-action"
                    type="button"
                    onclick="boostPerson()"
                >
                    🚀 تعزيز
                </button>

            </section>

        </section>

    </main>


    <nav class="bottom-nav">

        <a href="home.html" class="nav-item">
            <span>✨</span>
            <small>اكتشف</small>
        </a>

        <a href="search.html" class="nav-item">
            <span>🔎</span>
            <small>بحث</small>
        </a>

        <a href="chat.html" class="nav-item">
            <span>💬</span>
            <small>دردشة <b id="chatBadge" style="display:none;background:#c0392b;color:white;border-radius:10px;padding:1px 6px;font-size:10px;margin-right:4px;">0</b></small>
        </a>

        <a href="about-me.html" class="nav-item">
            <span>📝</span>
            <small>تعريفي</small>
        </a>

        <a href="profile.html" class="nav-item">
            <span>👤</span>
            <small>ملفي</small>
        </a>

    </nav>

</div>


<script>

document.addEventListener("DOMContentLoaded", async () => {

    const token =
        localStorage.getItem("session_token");

    if (!token) {
        window.location.href = "index.html";
        return;
    }


    const params =
        new URLSearchParams(window.location.search);

    const profileId =
        params.get("id");


    if (!profileId) {

        showError(
            "الملف غير محدد",
            "لم يتم تحديد الشخص المطلوب."
        );

        return;
    }


    try {

        const response =
            await fetch(
                `/api/profile/${encodeURIComponent(profileId)}`,
                {
                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        const result =
            await response.json();


        if (!response.ok || !result.success) {

            showError(
                "تعذر فتح الملف",
                result.message || "حدث خطأ."
            );

            return;
        }


        const user = result.profile;


        document.getElementById("profileImage").src =
            user.profile_image || "";


        document.getElementById("profileName").textContent =
            `${user.first_name || ""} ${user.last_name || ""}`.trim();


        document.getElementById("profileLocation").textContent =
            `${user.city || ""} • ${user.residence_country || ""}`;


        document.getElementById("profileAge").textContent =
            `${user.age} سنة`;


        document.getElementById("profileHeight").textContent =
            `${user.height || "—"} سم`;


        document.getElementById("profileWeight").textContent =
            `${user.weight || "—"} كجم`;


        document.getElementById("profileReligion").textContent =
            user.religion || "—";


        document.getElementById("nationality").textContent =
            user.nationality || "—";


        document.getElementById("residenceCountry").textContent =
            user.residence_country || "—";


        document.getElementById("city").textContent =
            user.city || "—";


        document.getElementById("height").textContent =
            `${user.height || "—"} سم`;


        document.getElementById("weight").textContent =
            `${user.weight || "—"} كجم`;


        document.getElementById("religion").textContent =
            user.religion || "—";


        document.getElementById("skinColor").textContent =
            user.skin_color || "—";


        document.getElementById("aboutMe").textContent =
            user.about_me || "لم تتم إضافة نبذة بعد.";


        document.getElementById("partnerDescription").textContent =
            user.partner_description ||
            "لم تتم إضافة نبذة عن شريك الحياة بعد.";


        document.getElementById("loadingBox").style.display =
            "none";


        document.getElementById("profileContent").style.display =
            "block";


        window.currentProfileId = user.id;


    } catch (error) {

        console.error(error);

        showError(
            "تعذر الاتصال بالسيرفر",
            "تأكد أن السيرفر يعمل ثم حاول مرة أخرى."
        );

    }


    function showError(title, message) {

        document.getElementById("loadingBox").innerHTML = `

            <div class="empty-icon">⚠️</div>

            <h2>${title}</h2>

            <p>${message}</p>

            <button
                class="member-action"
                type="button"
                onclick="history.back()"
            >
                ← العودة
            </button>

        `;

    }

});


function contactPerson() {

    alert(
        "سيتم فتح نظام التواصل لاحقًا."
    );

}


function skipPerson() {

    alert(
        "سيتم بناء نظام التخطي وحفظه لاحقًا."
    );

}


function boostPerson() {

    alert(
        "سيتم بناء نظام التعزيز لاحقًا."
    );

}

</script>

<script src="js/notifications.js"></script>
<script src="js/push.js"></script>
</body>
</html>
