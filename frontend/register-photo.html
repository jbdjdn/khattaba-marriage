<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8b6548">
    <title>الصورة وكلمة المرور - خطابة لزواج</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="app">

    <header class="top-header">
        <div class="brand">
            <div class="brand-icon">💍</div>

            <div class="brand-text">
                <strong>خطابة لزواج</strong>
                <span>إنشاء حساب جديد</span>
            </div>
        </div>
    </header>

    <section class="form-screen">

        <a href="register-basic.html" class="back-link">→ رجوع</a>

        <div class="step-info">
            <span>الخطوة 3 من التسجيل</span>
            <strong>الصورة وكلمة المرور</strong>
        </div>

        <h1>
            أكمل
            <span>ملفك</span>
        </h1>

        <p class="form-intro">
            ضع صورة واضحة وأنشئ كلمة مرور قوية لحماية حسابك.
        </p>

        <form id="accountForm">

            <div class="section-title">الصورة الشخصية</div>

            <div class="photo-upload">

                <div class="photo-preview" id="photoPreview">
                    <span>📷</span>
                    <small>الصورة</small>
                </div>

                <label for="profileImage" class="upload-button">
                    اختيار صورة
                </label>

                <input
                    type="file"
                    id="profileImage"
                    accept="image/jpeg,image/png,image/webp"
                    required
                >

                <small>
                    اختر صورة واضحة لك. سيتم قصها تلقائيًا لتناسب الملف.
                </small>

            </div>


            <div class="section-title">كلمة المرور</div>

            <div class="field">

                <label for="password">كلمة المرور</label>

                <div class="password-field">
                    <input
                        type="password"
                        id="password"
                        minlength="8"
                        placeholder="8 أحرف على الأقل"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                    >
                        👁
                    </button>
                </div>

            </div>

            <div class="field">

                <label for="confirmPassword">تأكيد كلمة المرور</label>

                <div class="password-field">
                    <input
                        type="password"
                        id="confirmPassword"
                        minlength="8"
                        placeholder="أعد كتابة كلمة المرور"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="toggleConfirmPassword"
                    >
                        👁
                    </button>
                </div>

            </div>

            <div class="password-rules">
                <span>✓ 8 أحرف على الأقل</span>
                <span>✓ لا تستخدم كلمة مرور سهلة</span>
            </div>

            <button type="submit" class="btn btn-primary form-submit">
                متابعة إلى المراجعة
            </button>

        </form>

    </section>

</main>

<script>

const profileImage = document.getElementById("profileImage");
const photoPreview = document.getElementById("photoPreview");

profileImage.addEventListener("change", () => {

    const file = profileImage.files[0];

    if (!file) {
        return;
    }

    if (!file.type.startsWith("image/")) {
        alert("الرجاء اختيار صورة صحيحة.");
        profileImage.value = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = (event) => {
        photoPreview.innerHTML = `
            <img src="${event.target.result}" alt="الصورة الشخصية">
        `;
    };

    reader.readAsDataURL(file);
});


function togglePasswordField(inputId) {

    const input = document.getElementById(inputId);

    input.type = input.type === "password"
        ? "text"
        : "password";
}


document.getElementById("togglePassword").addEventListener("click", () => {
    togglePasswordField("password");
});

document.getElementById("toggleConfirmPassword").addEventListener("click", () => {
    togglePasswordField("confirmPassword");
});


document.getElementById("accountForm").addEventListener("submit", (event) => {

    event.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password.length < 8) {
        alert("كلمة المرور يجب أن تكون 8 أحرف على الأقل.");
        return;
    }

    if (password !== confirmPassword) {
        alert("كلمتا المرور غير متطابقتين.");
        return;
    }

    const file = profileImage.files[0];

    if (!file) {
        alert("يجب اختيار صورة شخصية.");
        return;
    }

    const reader = new FileReader();

    reader.onload = (event) => {

        const accountData = {
            profileImage: event.target.result,
            password: password
        };

        localStorage.setItem(
            "registration_account",
            JSON.stringify(accountData)
        );

        window.location.href = "register-review.html";
    };

    reader.readAsDataURL(file);
});

</script>

</body>
</html>
